services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geocatalog
      POSTGRES_USER: geocatalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocatalog -d geocatalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://geocatalog:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/geocatalog
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
