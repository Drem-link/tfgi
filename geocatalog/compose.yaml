services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geocatalog
      POSTGRES_USER: geocatalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_demo_data.sql:/docker-entrypoint-initdb.d/002_demo_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocatalog -d geocatalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://geocatalog:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/geocatalog
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    ports:
      - "127.0.0.1:8443:8443"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --ssl-certfile
      - /tls/tls.crt
      - --ssl-keyfile
      - /tls/tls.key
    volumes:
      - ./tls:/tls:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
