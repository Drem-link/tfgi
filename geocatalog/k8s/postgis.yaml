apiVersion: v1
kind: PersistentVolume
metadata:
  name: geocatalog-postgis-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/containers/k8s-app-data/postgis
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - zabbix
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geocatalog-postgis
  namespace: geocatalog
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: geocatalog-postgis-pv
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: geocatalog-postgis
  namespace: geocatalog
spec:
  type: ClusterIP
  selector:
    app: geocatalog-postgis
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geocatalog-postgis
  namespace: geocatalog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geocatalog-postgis
  template:
    metadata:
      labels:
        app: geocatalog-postgis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: geocatalog
            - name: POSTGRES_USER
              value: geocatalog
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geocatalog-db
                  key: PGPASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "geocatalog", "-d", "geocatalog"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "geocatalog", "-d", "geocatalog"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001_schema.sql
              subPath: 001_schema.sql
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: geocatalog-postgis
        - name: schema
          configMap:
            name: geocatalog-schema
            items:
              - key: 001_schema.sql
                path: 001_schema.sql
