apiVersion: v1
kind: Service
metadata:
  name: geocatalog
  namespace: geocatalog
spec:
  type: NodePort
  selector:
    app: geocatalog
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 30808
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geocatalog
  namespace: geocatalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geocatalog
  template:
    metadata:
      labels:
        app: geocatalog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/drem-link/tfgi-geocatalog:feature-geological-map-mvp
          imagePullPolicy: Always
          command: ["uvicorn"]
          args:
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8443"
            - --ssl-certfile
            - /tls/tls.crt
            - --ssl-keyfile
            - /tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: PGHOST
              value: geocatalog-postgis
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: geocatalog
            - name: PGUSER
              value: geocatalog
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: geocatalog-db
                  key: PGPASSWORD
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geocatalog-auth
                  key: AUTH_USERNAME
            - name: AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: geocatalog-auth
                  key: AUTH_PASSWORD_HASH
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: geocatalog-auth
                  key: SESSION_SECRET
          startupProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: geocatalog-tls
