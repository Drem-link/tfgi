name: Geological catalog image

on:
  push:
    branches:
      - feature/geological-map-mvp
    paths:
      - "geocatalog/**"
      - ".github/workflows/geocatalog-image.yml"
  pull_request:
    paths:
      - "geocatalog/**"
      - ".github/workflows/geocatalog-image.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: geocatalog/requirements-dev.txt
      - name: Run API tests
        working-directory: geocatalog
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Check browser JavaScript
        run: node --check geocatalog/app/static/app.js

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/drem-link/tfgi-geocatalog
          tags: |
            type=raw,value=feature-geological-map-mvp
            type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: geocatalog
          file: geocatalog/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
